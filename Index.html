<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stroik – gitara i ukulele</title>
<style>
  :root {
    --bg: #14110f;
    --panel: #201b17;
    --line: #3a322b;
    --text: #f3ece2;
    --muted: #9b8f80;
    --ok: #7bd88f;
    --low: #ff7a59;   /* za nisko -> napnij */
    --high: #f2c14e;  /* za wysoko -> poluzuj */
    --accent: #e9dcc6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex; justify-content: center; align-items: center;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }
  .card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .seg button, .strings button, #startBtn {
    font: inherit; border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 10px; padding: 11px 6px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: #1c1713; border-color: var(--accent); font-weight: 700; }
  .strings { display: flex; gap: 6px; margin-bottom: 18px; }
  .strings button { flex: 1; padding: 10px 0; font-size: .95rem; }
  .strings button.auto { flex: 1.5; }
  .strings button.locked { border-color: var(--accent); color: var(--text); }
  .strings button.hit { background: #2d261f; color: var(--text); }
